# Stack para Dockge: nginx sirviendo la carpeta ./html (copia de la raíz de este repo).
# Es el mismo esquema que el stack "web" que ya existe en el servidor (nginx:alpine, puerto 8080).
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
